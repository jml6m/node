name: SEA eager-compile benchmark

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    strategy:
      matrix:
        side: [before, after]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.side == 'before' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3 g++ make

      - name: Build
        run: |
          python3 ./configure
          make -j"$(nproc)"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.side }}
          path: out/Release/node
          retention-days: 14

  benchmark:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download "before" binary
        uses: actions/download-artifact@v4
        with:
          name: node-before
          path: artifacts/before

      - name: Download "after" binary
        uses: actions/download-artifact@v4
        with:
          name: node-after
          path: artifacts/after

      - name: Prep binaries
        run: |
          mkdir -p bench
          cp artifacts/before/node bench/node-before
          cp artifacts/after/node bench/node-after
          chmod +x bench/node-before bench/node-after

      - name: Generate SEA benchmark fixture
        run: |
          awk 'BEGIN{
            print "\x27use strict\x27;";
            print "let total = 0;";
            for(i=0;i<12000;i++){
              printf "function f%d(x) { return (x * %d + %d) %% 97; }\n", i, i, i*3+1;
            }
            print "const start = process.hrtime.bigint();";
            for(i=0;i<12000;i++){
              printf "total += f%d(%d);\n", i, i;
            }
            print "const end = process.hrtime.bigint();";
            print "console.error(\x27exec_ns=\x27 + (end - start).toString() + \x27 total=\x27 + total);";
          }' > bench/sea-bench.js
          cat > bench/sea-config.json <<'EOF'
          {
            "main": "sea-bench.js",
            "output": "sea-bench.blob",
            "disableExperimentalSEAWarning": true,
            "useCodeCache": false
          }
          EOF

      - name: Build and benchmark both SEAs
        run: |
          cd bench
          for label in before after; do
            rm -f sea-bench.blob "sea-bench-$label"
            "./node-$label" --experimental-sea-config sea-config.json
            cp "node-$label" "sea-bench-$label"
            npx --yes postject "sea-bench-$label" NODE_SEA_BLOB sea-bench.blob \
              --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
            chmod +x "sea-bench-$label"
          done

          {
            echo "## SEA eager-compile benchmark"
            echo ""
            echo "3 warmup runs (discarded) + 15 timed runs, wall-clock ms, same runner/toolchain for both sides."
            echo ""
            echo "| label | mean ms | runs (ms) |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          : > results.txt
          for label in before after; do
            for i in 1 2 3; do ./"sea-bench-$label" >/dev/null 2>/dev/null || true; done
            total=0
            runs=""
            for i in $(seq 1 15); do
              start=$(date +%s%N)
              ./"sea-bench-$label" >/dev/null 2>/dev/null
              end=$(date +%s%N)
              elapsed_ms=$(( (end - start) / 1000000 ))
              total=$((total + elapsed_ms))
              runs="$runs $elapsed_ms"
            done
            mean=$((total / 15))
            echo "$label mean: ${mean}ms (runs:$runs)" | tee -a results.txt
            echo "| $label | ${mean}ms |$runs |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sea-eager-compile-results-${{ github.event.pull_request.head.sha }}
          path: bench/results.txt
          retention-days: 14
